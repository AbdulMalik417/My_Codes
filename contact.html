</head>

<body>

    <header>
        <div class="container">

            <div class="logo">AMITECH</div>

            <button class="menu-toggle" id="menuToggle"
    aria-label="Open navigation menu"
    aria-expanded="false">
    ☰
</button>

<nav id="mainNav">
    <a href="index.html">Home</a>

    <a href="services.html">Services</a>
    <a href="projects.html">Projects</a>
    <a href="contact.html">Contact</a>
</nav>

        </div>
    </header>

    <section class="page-banner">
        <h1>Contact AMITECH</h1>
        <p>Let's discuss your next technology project.</p>
    </section>

    <section class="page-content">

        <h2>Get in Touch</h2>

        <p>Phone: 07062254511</p>

        <p>Email: amitech180@gmail.com</p>

        <p>WhatsApp: 07062254511</p>

        <a
            class="btn"
            href="https://wa.me/2347062254511"
            target="_blank"
            rel="noopener noreferrer">
            Chat with Us on WhatsApp
        </a>

        <form id="contactForm">

    <div class="form-group">
        <label for="customerName">Full Name</label>
        <input
            type="text"
            id="customerName"
            placeholder="Enter your full name"
            required
        >
    </div>

    <div class="form-group">
        <label for="customerEmail">Email Address</label>
        <input
            type="email"
            id="customerEmail"
            placeholder="Enter your email"
            required
        >
    </div>

    <div class="form-group">
        <label for="customerPhone">Phone Number</label>
        <input
            type="tel"
            id="customerPhone"
            placeholder="Enter your phone number"
            required
        >
    </div>

    <div class="form-group">
        <label for="customerService">Select a Service</label>

        <select id="customerService" required>
            <option value="">Choose a service</option>
            <option value="Solar Installation">Solar Installation</option>
            <option value="CCTV Installation">CCTV Installation</option>
            <option value="Arduino and Embedded Systems">Arduino and Embedded Systems</option>
            <option value="Web Development">Web Development</option>
            <option value="AI Solutions">AI Solutions</option>
        </select>
    </div>

    <div class="form-group">
        <label for="customerMessage">Your Message</label>

        <textarea
            id="customerMessage"
            rows="5"
            placeholder="Tell us how we can help"
            required
        ></textarea>
    </div>

    <button type="submit">Submit Enquiry</button>

    <p id="formMessage"></p>

</form>

    </section>

</body>
